[project]
name = "fase0-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = 'DESKTOP-BNNIPES\USUARIO', email = "sergioherreravel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "requests>=2.34.2",
]

[project.scripts]
fase0-python = "fase0_python:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
